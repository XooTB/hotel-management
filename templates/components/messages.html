{% if messages %}
<div class="fixed right-4 top-4 z-[60] w-80 max-w-[calc(100vw-2rem)] space-y-2 print:hidden" aria-live="polite">
  {% for message in messages %}
  <div x-data="{ show: true }" x-init="setTimeout(() => show = false, 6000)" x-show="show" x-transition.opacity
       class="card flex items-start gap-3 p-4 shadow-lg {% if message.tags == 'error' %}border-rose-200{% elif message.tags == 'success' %}border-emerald-200{% endif %}">
    <span class="mt-0.5 {% if message.tags == 'error' %}text-rose-600{% elif message.tags == 'success' %}text-emerald-600{% else %}text-sky-600{% endif %}">
      {% if message.tags == 'error' %}{% icon 'alert' 'h-5 w-5' %}{% else %}{% icon 'check' 'h-5 w-5' %}{% endif %}
    </span>
    <p class="flex-1 text-sm text-slate-700">{{ message }}</p>
    <button type="button" @click="show = false" class="text-slate-400 hover:text-slate-600" aria-label="Dismiss">{% icon 'x' 'h-4 w-4' %}</button>
  </div>
  {% endfor %}
</div>
{% endif %}
