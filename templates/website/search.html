{% extends "website/base_public.html" %}
{% block title %}Find a room · {{ HOTEL_NAME }}{% endblock %}
{% block content %}
<section class="bg-brand-900">
  <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
    <h1 class="font-display text-3xl font-semibold text-white sm:text-4xl">Find your room</h1>
    <form method="get" hx-get="{% url 'website:search' %}" hx-target="#results" hx-swap="outerHTML" hx-push-url="true" hx-trigger="submit, change"
          class="mt-6 grid max-w-4xl gap-4 rounded-2xl bg-white p-4 sm:grid-cols-2 lg:grid-cols-[1fr_1fr_0.6fr_auto] lg:items-end">
      <div class="form-field"><label for="{{ form.check_in.id_for_label }}">Check-in</label>{{ form.check_in }}</div>
      <div class="form-field"><label for="{{ form.check_out.id_for_label }}">Check-out</label>{{ form.check_out }}</div>
      <div class="form-field"><label for="{{ form.guests.id_for_label }}">Guests</label>{{ form.guests }}</div>
      <button type="submit" class="btn-primary py-2.5">{% icon 'search' 'h-4 w-4' %} Search</button>
    </form>
  </div>
</section>
<section class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
  {% include "website/partials/search_results.html" %}
</section>
{% endblock %}
