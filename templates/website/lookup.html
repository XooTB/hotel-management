{% extends "website/base_public.html" %}
{% block title %}Manage booking · {{ HOTEL_NAME }}{% endblock %}
{% block content %}
<section class="mx-auto max-w-md px-4 py-16 sm:px-6">
  <div class="text-center">
    <h1 class="font-display text-3xl font-semibold text-brand-900">Manage your booking</h1>
    <p class="mt-2 text-slate-600">Enter the reference from your confirmation email.</p>
  </div>
  <form method="post" class="card mt-8 space-y-5 p-6">
    {% csrf_token %}
    {% include "components/form_fields.html" with grid="grid-cols-1" %}
    <button type="submit" class="btn-primary w-full">Find my booking</button>
  </form>
</section>
{% endblock %}
